<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildings — PropertyManager</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <div class="app-container">
        <!-- Desktop Sidebar -->
        <aside id="desktop-sidebar" class="sidebar"></aside>

        <!-- Mobile Top Header -->
        <header id="mobile-header" class="mobile-header"></header>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="page-body">
                <div class="page-title-row">
                    <div>
                        <h1 class="page-title">Buildings Management</h1>
                        <div class="page-subtitle">Track properties & construction cost recovery</div>
                    </div>
                    <button id="add-building-btn" class="btn btn-primary">+ Add Building</button>
                </div>

                <!-- Search Bar -->
                <div class="filter-bar">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="building-search-input" class="form-control" placeholder="Search building name or address..." />
                    </div>
                </div>

                <!-- Buildings Card List Container -->
                <div id="buildings-list-container" class="card-list">
                    <div class="empty-state">
                        <div class="loading-spinner loading-spinner-blue" style="margin: 0 auto;"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Mobile Bottom Nav -->
        <nav id="mobile-bottom-nav" class="bottom-nav"></nav>
    </div>

    <!-- Building Modal (Add / Edit) -->
    <div id="building-modal" class="modal-backdrop">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title" id="building-modal-title">Add New Building</h3>
                <button class="modal-close-btn" id="building-modal-close">✕</button>
            </div>
            <form id="building-form">
                <input type="hidden" id="building-id" />
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Building Name <span class="required">*</span></label>
                        <input type="text" id="bldg-name" class="form-control" placeholder="e.g. Building A / Commercial Complex 1" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <input type="text" id="bldg-address" class="form-control" placeholder="e.g. 123 MG Road, Sector 4" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Construction Cost ₹ <span class="required">*</span></label>
                        <input type="number" id="bldg-cost" class="form-control" placeholder="e.g. 12000000" min="0" step="any" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Notes / Description</label>
                        <textarea id="bldg-notes" class="form-control" placeholder="Optional notes..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="building-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Building</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/buildings.js"></script>
</body>
</html>
